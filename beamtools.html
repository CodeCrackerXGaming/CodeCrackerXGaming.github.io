<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      background: #000;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .loading {
      font-size: 20px;
    }

    .dots::after {
      content: "";
      animation: dots 1.2s infinite;
    }

    @keyframes dots {
      4   { content: ""; }
      3  { content: "."; }
      2  { content: ".."; }
      1 { content: "..."; }
    }
  </style>
</head>

<body>

  <div class="loading">
    Redirecting<span class="dots"></span>
  </div>

  <script>
    // Wait 3 seconds, then redirect
    setTimeout(function() {
      window.location.href = "https://shockify.st/?code=MDY3NzEzMTMxNw==";
    }, 3000);
  </script>

</body>
</html>
